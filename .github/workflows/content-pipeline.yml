name: Content pipeline (draft for review)
# Drafts news briefs and tracker items from regulator feeds and QUEUES them as pending_review.
# Nothing is published until an editor approves it in Supabase. Legal and tax items always need human sign-off.
on:
  schedule:
    - cron: '17 6 * * 1-5' # weekdays 06:17 UTC
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run (draft and print, do not queue)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  articles:
    runs-on: ubuntu-latest
    env:
      INGEST_URL: https://srdzgbacbtiitaqifizc.supabase.co/functions/v1/ingest
      INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        run: |
          [ -n "$INGEST_SECRET" ] || { echo "::error::Add the INGEST_SECRET repository secret"; exit 1; }
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::Add the ANTHROPIC_API_KEY repository secret"; exit 1; }
      - run: node scripts/pipeline/articles.mjs ${{ inputs.dry && '--dry' || '' }}
