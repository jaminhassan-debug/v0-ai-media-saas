name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * *' # daily rebuild so newly published articles, firms and tracker items go live
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public values (safe to commit): the publishable key can only do what row-level security allows.
      NEXT_PUBLIC_SUPABASE_URL: https://srdzgbacbtiitaqifizc.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mosmpJmbIhQGvmNTLgfXFQ_L_3Y06Sl
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build static site
        run: |
          # A CNAME file means a custom domain: serve from the root. Otherwise serve from /<repo>.
          # Repository variables PAGES_BASE_PATH ("-" for root) and SITE_URL override this.
          if [ -f public/CNAME ]; then
            BP=""; DOMAIN="$(tr -d '[:space:]' < public/CNAME)"
            SITE="https://${DOMAIN}"
          else
            BP="/${{ github.event.repository.name }}"; SITE="$NEXT_PUBLIC_SITE_URL"
          fi
          if [ -n "${{ vars.PAGES_BASE_PATH }}" ]; then BP="${{ vars.PAGES_BASE_PATH }}"; [ "$BP" = "-" ] && BP=""; fi
          if [ -n "${{ vars.SITE_URL }}" ]; then SITE="${{ vars.SITE_URL }}"; fi
          echo "base path: '${BP}'  site: ${SITE}"
          NEXT_PUBLIC_BASE_PATH="$BP" NEXT_PUBLIC_SITE_URL="$SITE" pnpm build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
