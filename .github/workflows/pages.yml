name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public values (safe to commit): the publishable key can only do what row-level security allows.
      NEXT_PUBLIC_SUPABASE_URL: https://srdzgbacbtiitaqifizc.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mosmpJmbIhQGvmNTLgfXFQ_L_3Y06Sl
      # Set repository variable PAGES_BASE_PATH to "-" once a custom domain is attached; default serves at /<repo>.
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build static site
        run: |
          BP="${{ vars.PAGES_BASE_PATH }}"
          if [ -z "$BP" ]; then BP="/${{ github.event.repository.name }}"; fi
          if [ "$BP" = "-" ]; then BP=""; fi
          NEXT_PUBLIC_BASE_PATH="$BP" pnpm build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
